# statement.yaml — JSP-000301 / Erdős #365 形式化证否（正式声明，证据仓版本）
# 定义与 jsp000301proof.lean 中的实际代码逐字一致（L42–L46）。
# 注意：authorship.signatories 至少 2 个 GitHub handle（schema 硬性 minItems: 2）。

id: STMT-jsp-000301-disproof-v1
status: active
supersedes: null

statement:
  # 形式化命题文本（与原题否定一一对应；与 erdos_365_witness 签名一致）
  text: "∃ m : ℕ, IsPowerful m ∧ IsPowerful (m + 1) ∧ ¬IsSquare m ∧ ¬IsSquare (m + 1)"
  # 原始问题来源（自然语言）
  natural_language_source: >-
    If two consecutive positive integers are powerful, must at least one be a perfect square?
    (Erdős problem #365; answer is NO — Golomb 1970 disproof.)
  # 声明所依赖的定义审查；本证否自行定义（from_library: false），逐字对应 Lean 源码
  definitions_reviewed:
    - name: IsPowerful
      from_library: false
      review: "∀ p : ℕ, p.Prime → p ∣ n → 2 ≤ n.factorization p   # jsp000301proof.lean L42–L43"
    - name: IsSquare
      from_library: false
      review: "∃ k : ℕ, n = k ^ 2   # jsp000301proof.lean L46"
  # 固定库版本（Mathlib 40 位 commit）
  library:
    name: mathlib
    commit: "5ed2965256430c3649e86755f9576b54eca72435"            # 40-hex，lakefile 锁定的 Mathlib commit（v4.34.0）
    meets_minimum_safe_version: true

authorship:
  signatories:
    - "wangweiqi388"                       # GitHub handle（主署名人，证明仓 owner）
    - "onewitch"                           # GitHub handle（第二署名人，同一本人的第二个账号）
  issued_at: "2026-09-20"                  # ISO 日期 YYYY-MM-DD
