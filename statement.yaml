id: STMT-jsp-000301-disproof-v1
status: active
supersedes: null

statement:
  # Formalized proposition text (one-to-one with the negation of the original question; matches the erdos_365_witness signature).
  text: "∃ m : ℕ, IsPowerful m ∧ IsPowerful (m + 1) ∧ ¬IsSquare m ∧ ¬IsSquare (m + 1)"
  # Original problem source (natural language).
  natural_language_source: >-
    If two consecutive positive integers are powerful, must at least one be a perfect square?
    (Erdős problem #365; answer is NO — Golomb 1970 disproof.)
  # Review of the definitions the statement relies on; this disproof defines them itself
  # (from_library: false), verbatim from the Lean source.
  definitions_reviewed:
    - name: IsPowerful
      from_library: false
      review: "∀ p : ℕ, p.Prime → p ∣ n → 2 ≤ n.factorization p   # jsp000301proof.lean L42–L43"
    - name: IsSquare
      from_library: false
      review: "∃ k : ℕ, n = k ^ 2   # jsp000301proof.lean L46"
  # Pinned library version (Mathlib 40-hex commit).
  library:
    name: mathlib
    commit: "5ed2965256430c3649e86755f9576b54eca72435"            # 40-hex, Mathlib commit locked by lakefile (v4.34.0)
    meets_minimum_safe_version: true

